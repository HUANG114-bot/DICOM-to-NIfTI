
name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name DICOM_to_NIfTI --collect-all dicom2nifti --collect-all nibabel --collect-all pydicom --collect-all scipy dicom_nifti_gui.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "DICOM_to_NIfTI.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DICOM_to_NIfTI_Windows_Installer
          path: installer_output/*.exe
          if-no-files-found: error
